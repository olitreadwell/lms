name: Semantic Pull Request

on:
  pull_request: {}

jobs:
  # This workflow contains a single job called "build"
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # zeke/semantic-pull-requests is a retired Probot app, not an action, so it
      # has no action manifest on any ref and this job failed before it started.
      # amannn/action-semantic-pull-request is the replacement its own README
      # recommends; `types` mirrors the type-enum in commitlint.config.js.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
            deprecate
